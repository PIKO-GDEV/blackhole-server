<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الثقب الأسود | مجتمع المطورين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --bg-soft: #0a0a0a;
      --text: #ffffff;
      --text-muted: #b0b0b0;
      --accent: #ffffff;
      --border: rgba(255, 255, 255, 0.12);
      --glow: rgba(255, 255, 255, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(1px 1px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 50px 160px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 90px 40px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 130px 80px, #fff, transparent),
        radial-gradient(1px 1px at 160px 120px, rgba(255,255,255,0.7), transparent);
      background-size: 200px 200px;
      animation: stars-move 120s linear infinite;
      opacity: 0.4;
    }

    @keyframes stars-move {
      from { transform: translateY(0); }
      to { transform: translateY(-200px); }
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    header {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px 80px;
      position: relative;
    }

    .logo-wrapper {
      position: relative;
      margin-bottom: 32px;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .logo {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 
        0 0 40px rgba(255,255,255,0.15),
        0 0 80px rgba(255,255,255,0.08),
        inset 0 0 30px rgba(0,0,0,0.6);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .logo:hover {
      transform: scale(1.05);
      box-shadow: 
        0 0 60px rgba(255,255,255,0.25),
        0 0 100px rgba(255,255,255,0.12);
    }

    .logo-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 210px;
      height: 210px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      animation: pulse-ring 4s ease-out infinite;
    }

    @keyframes pulse-ring {
      0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.6; }
      70% { transform: translate(-50%, -50%) scale(1.15); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0; }
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #c0c0c0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeUp 1s ease 0.2s both;
    }

    .tagline {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 560px;
      margin: 0 auto 40px;
      font-weight: 400;
      animation: fadeUp 1s ease 0.4s both;
    }

    .join-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      color: #000000;
      font-family: 'Cairo', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 16px 42px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 0 30px rgba(255,255,255,0.25);
      animation: fadeUp 1s ease 0.6s both;
    }

    .join-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 50px rgba(255,255,255,0.4);
      background: #f0f0f0;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .logo {
        width: 140px;
        height: 140px;
      }
      .logo-ring {
        width: 165px;
        height: 165px;
      }
      .join-btn {
        padding: 14px 32px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <header>
    <div class="logo-wrapper">
      <div class="logo-ring"></div>
      <img src="https://images.unsplash.com/photo-1462331940025-496dfbfcba31?w=500&h=500&fit=crop" alt="الثقب الأسود" class="logo">
    </div>

    <h1>الثقب الأسود</h1>
    <p class="tagline">
      مجتمع للمطورين وصنّاع الأفكار<br>
      مكان للتعلم، المشاركة، وصناعة أشياء تستحق التجربة
    </p>

    <a href="https://discord.gg/YVFxQXux" class="join-btn" target="_blank" rel="noopener">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">

      </svg>
      انضم إلى السيرفر
    </a>
  </header>

  <footer>
    <p>© 2026 الثقب الأسود — مجتمع المطورين</p>
  </footer>
</body>
</html>
